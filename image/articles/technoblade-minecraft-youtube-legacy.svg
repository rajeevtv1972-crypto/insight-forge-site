 <rect x="92" y="124" width="34" height="34" fill="#251631"/><rect x="387" y="147" width="24" height="24" fill="#5e244e"/>
 <rect x="140" y="177" width="60" height="42" fill="#f4b6d3"/><rect x="224" y="177" width="60" height="42" fill="#f4b6d3"/>
 <rect x="150" y="189" width="16" height="16" fill="#6c3556"/><rect x="250" y="189" width="16" height="16" fill="#6c3556"/>
