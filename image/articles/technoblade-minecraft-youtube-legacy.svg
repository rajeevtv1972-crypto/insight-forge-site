<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Technoblade Minecraft YouTube legacy editorial artwork</title>
<desc id="desc">Original pixel-inspired pink pig silhouette, Minecraft landscape, crown and YouTube-style play symbol representing Technoblade's gaming legacy.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#160d29"/><stop offset=".52" stop-color="#52215f"/><stop offset="1" stop-color="#211a4d"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9acb"/><stop offset="1" stop-color="#e04d92"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="980" cy="155" r="125" fill="url(#sun)" opacity=".78"/>
<path d="M0 495 L155 405 300 470 445 372 600 465 760 350 925 455 1080 365 1200 425 1200 675 0 675Z" fill="#11142d"/>
