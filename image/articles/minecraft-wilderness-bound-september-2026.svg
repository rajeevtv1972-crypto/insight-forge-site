<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Minecraft Wilderness Bound 2026 editorial artwork</title>
<desc id="desc">Original blocky forest landscape artwork inspired by the Minecraft Wilderness Bound game drop, with poplar trees, an abandoned camp and a player carrying a map.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bd7ff"/><stop offset="1" stop-color="#dff6d6"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8a57"/><stop offset="1" stop-color="#294f36"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a35"/><stop offset="1" stop-color="#51351f"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="930" cy="120" r="74" fill="#fff4bd" opacity=".75"/>
<path d="M0 390 L150 320 260 370 390 285 520 360 680 275 800 345 960 250 1200 350 1200 675 0 675Z" fill="#6ca36b" opacity=".65"/>
<path d="M0 470 L170 400 315 455 470 380 640 465 805 390 965 450 1100 375 1200 420 1200 675 0 675Z" fill="url(#ground)"/>
<!-- blocky poplar trees -->
<g>
 <rect x="135" y="275" width="34" height="240" fill="#543923"/><rect x="116" y="218" width="72" height="80" fill="#64874c"/><rect x="96" y="242" width="112" height="58" fill="#769e59"/><rect x="130" y="190" width="42" height="64" fill="#88aa63"/>
 <rect x="365" y="250" width="37" height="250" fill="#573a24"/><rect x="340" y="195" width="86" height="82" fill="#557d4d"/><rect x="315" y="226" width="138" height="68" fill="#709657"/><rect x="355" y="165" width="57" height="75" fill="#84a85f"/>
 <rect x="1010" y="255" width="40" height="250" fill="#4f3421"/><rect x="980" y="198" width="92" height="82" fill="#557b4a"/><rect x="948" y="225" width="150" height="72" fill="#6e9554"/><rect x="1000" y="170" width="60" height="75" fill="#88aa63"/>
</g>
<!-- abandoned camp -->
<g>
 <path d="M690 480 L825 395 960 480Z" fill="#d2ad77"/><path d="M720 470 L825 410 930 470" fill="#b86f50" stroke="#75452f" stroke-width="10"/>
 <rect x="790" y="462" width="70" height="72" rx="3" fill="#6b472c"/>
 <rect x="700" y="528" width="250" height="20" fill="#7c552f"/>
 <circle cx="1015" cy="535" r="28" fill="#f9d174"/><path d="M1015 500 L1000 475 M1015 500 L1030 470 M1015 505 L992 495 M1015 505 L1038 493" stroke="#ff9c4b" stroke-width="9" stroke-linecap="round"/>
</g>
<!-- map-holding player -->
<g transform="translate(555 365)">
 <rect x="0" y="55" width="58" height="115" fill="#2a5b9e"/><rect x="10" y="170" width="18" height="72" fill="#3c3b39"/><rect x="34" y="170" width="18" height="72" fill="#3c3b39"/>
 <rect x="-35" y="75" width="36" height="85" fill="#c78a54"/><rect x="55" y="75" width="36" height="85" fill="#c78a54"/>
 <rect x="6" y="10" width="48" height="52" fill="#c78a54"/><rect x="18" y="0" width="38" height="17" fill="#4a3527"/>
 <rect x="-5" y="122" width="78" height="42" fill="#f6e2a8" stroke="#6d5537" stroke-width="5"/>
</g>
<rect x="54" y="50" width="490" height="116" rx="22" fill="#0f2c20" opacity=".86"/>
<text x="82" y="103" fill="#d7ffe2" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" letter-spacing="3">MINECRAFT • SEPTEMBER 2026</text>
<text x="82" y="142" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900">Wilderness Bound</text>
<text x="82" y="610" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800">DAPPLED FOREST • POPLAR TREES • ABANDONED CAMPS • EXPLORATION</text>
</svg>