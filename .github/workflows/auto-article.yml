name: Auto Publish News Article

on:
  schedule:
    - cron: '30 10 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category for a manual run (use auto for rotation)'
        required: false
        type: choice
        options:
          - auto
          - Technology
          - Movies
          - Anime
          - Space
          - Gaming
        default: auto

permissions:
  contents: write

concurrency:
  group: auto-article-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      ARTICLE_CATEGORY: ${{ inputs.category || 'auto' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Insight Forge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate and publish article
        run: python3 scripts/auto_article.py

      - name: Commit generated article
        run: |
          if git diff --quiet; then
            echo "No files changed; nothing to commit."
            exit 0
          fi
          git add .
          git commit -m "Auto-publish fresh news article"
          git push origin main
